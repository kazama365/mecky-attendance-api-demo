spring.application.name=mecky-attendance-api
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/mecky_attendance?useSSL=false&serverTimezone=Asia/Manila&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:mecky_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Manila
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=${DB_MIGRATION_USERNAME:${DB_USERNAME:mecky_app}}
spring.flyway.password=${DB_MIGRATION_PASSWORD:${DB_PASSWORD:}}
app.jwt.secret=${JWT_SECRET}
app.jwt.minutes=480
app.device.api-key=${DEVICE_API_KEY:}
app.backup.directory=${BACKUP_DIRECTORY:./backups}
