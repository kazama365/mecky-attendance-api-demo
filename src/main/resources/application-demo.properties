# Demo-only database. Data is intentionally in memory and is cleared when the service restarts.
spring.datasource.url=jdbc:h2:mem:mecky_demo;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false
spring.jpa.open-in-view=false
server.port=${PORT:8080}

# Safe only for the isolated demo profile. Set JWT_SECRET on Render to override it.
app.jwt.secret=${JWT_SECRET:mecky-demo-jwt-secret-only-not-for-production-2026}
