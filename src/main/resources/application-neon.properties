server.port=${PORT:8080}
spring.datasource.url=${NEON_JDBC_URL}
spring.datasource.username=${NEON_DB_USERNAME}
spring.datasource.password=${NEON_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/postgresql
spring.flyway.user=${NEON_DB_USERNAME}
spring.flyway.password=${NEON_DB_PASSWORD}
app.bootstrap.admin-password=${MECKY_INITIAL_ADMIN_PASSWORD:}
